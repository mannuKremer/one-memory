name: Memory proposal
description: Propose a change to the memory in this repository. Nothing changes until the owner approves it with /memory-review.
title: "[memory] "
labels:
  - memory-proposal
body:
  - type: markdown
    attributes:
      value: |
        Use the format from `PROTOCOL.md`, section 5. If an assistant printed a proposal for you, replace the example below with it.
        **Professional facts only.** Never include health, family, finances, contact details, IDs, secrets, other people's personal data or confidential employer information.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: One "### Change" block per change, then the footer.
      value: |
        ### Change 1
        - **File:** `memory/learning.md`
        - **Action:** add
        - **Why:**

        **After**
        ~~~markdown

        ~~~

        ---
        - **Source:** manual
        - **Date:**
        - **Privacy check:** professional only, nothing from PROTOCOL.md section 4
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This proposal contains professional information only, and nothing from the "Never store" list in PROTOCOL.md.
          required: true
